name: KataBump Renewal (Private Only)

# Do not run renewal from a public fork: Actions logs and artifacts are public.
# Copy the repository to an independent PRIVATE repository before enabling this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          python -m pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: Check required secrets without exposing values
        env:
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        run: |
          if [ -z "$KATABUMP_EMAIL" ] || [ -z "$KATABUMP_PASSWORD" ]; then
            echo "::error::Configure KATABUMP_EMAIL and KATABUMP_PASSWORD in repository Actions secrets."
            exit 1
          fi

      - name: Renew (single account; no external proxy bootstrap)
        env:
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: 'false'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python app.py
